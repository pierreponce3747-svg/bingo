<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    min-height: 100vh;
    color: #fff;
    padding: 20px;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 { font-size: 2rem; }
  .mode-toggle { display: flex; gap: 8px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: transform 0.1s, background 0.2s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .btn-primary { background: #4caf50; color: #fff; }
  .btn-primary:hover { background: #43a047; }
  .btn-secondary { background: rgba(255,255,255,0.15); color: #fff; }
  .btn-secondary:hover { background: rgba(255,255,255,0.25); }
  .btn-danger { background: #e53935; color: #fff; }
  .btn-danger:hover { background: #d32f2f; }
  .btn-active { background: #fff; color: #1e3c72; }

  .last-number {
    background: rgba(0,0,0,0.25);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
    border: 2px solid rgba(255,255,255,0.1);
  }
  .last-number-label {
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .last-number-value {
    font-size: 5rem;
    font-weight: 800;
    line-height: 1;
    color: #ffd54f;
    text-shadow: 0 4px 20px rgba(255, 213, 79, 0.4);
  }
  .last-number-value.empty {
    color: rgba(255,255,255,0.3);
    font-size: 2.5rem;
  }
  .stats {
    margin-top: 12px;
    font-size: 0.95rem;
    opacity: 0.8;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 6px;
    background: rgba(0,0,0,0.2);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 20px;
  }
  .cell {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.95);
    color: #1e3c72;
    font-weight: 700;
    font-size: 1.1rem;
    border-radius: 6px;
    transition: all 0.2s;
    user-select: none;
  }
  .cell.drawn {
    background: #ffd54f;
    color: #1e3c72;
    transform: scale(1.05);
    box-shadow: 0 4px 12px rgba(255, 213, 79, 0.4);
  }
  .cell.last {
    background: #ff6b35;
    color: #fff;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1.05); }
    50% { transform: scale(1.12); box-shadow: 0 6px 20px rgba(255, 107, 53, 0.6); }
  }
  .cell.admin { cursor: pointer; }
  .cell.admin:hover:not(.drawn) {
    background: #c5e1a5;
    transform: scale(1.05);
  }
  .cell.admin.drawn:hover { background: #ffab91; }

  .history {
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .history h3 {
    margin-bottom: 10px;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.8;
  }
  .history-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .history-item {
    background: rgba(255,255,255,0.15);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .history-item.latest { background: #ff6b35; }
  .history-empty { opacity: 0.5; font-style: italic; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-content {
    background: #fff;
    color: #333;
    padding: 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 400px;
  }
  .modal-content h2 { margin-bottom: 16px; color: #1e3c72; }
  .modal-content input {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 16px;
  }
  .modal-content input:focus { outline: none; border-color: #2a5298; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
  .error-msg {
    color: #e53935;
    font-size: 0.9rem;
    margin-bottom: 10px;
    min-height: 1.2em;
  }
  .info-banner {
    background: rgba(255, 213, 79, 0.2);
    border: 1px solid rgba(255, 213, 79, 0.4);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .loading { text-align: center; padding: 40px; opacity: 0.6; }
  .connection-status {
    position: fixed;
    bottom: 12px;
    right: 12px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
  }
  .connection-status.online::before {
    content: '●';
    color: #4caf50;
    margin-right: 6px;
  }
  .connection-status.offline::before {
    content: '●';
    color: #e53935;
    margin-right: 6px;
  }

  @media (max-width: 700px) {
    h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: repeat(9, 1fr); gap: 4px; padding: 8px; }
    .cell { font-size: 0.85rem; }
    .last-number-value { font-size: 3.5rem; }
    button { padding: 8px 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎱 Bingo</h1>
    <div class="mode-toggle">
      <button id="viewPublicBtn" class="btn-active">👁 Vue publique</button>
      <button id="viewAdminBtn" class="btn-secondary">🔒 Admin</button>
    </div>
  </header>

  <div id="adminBanner" class="info-banner" style="display:none;">
    ✏️ Mode admin actif — clique sur un numéro pour le marquer comme tiré (ou le retirer)
  </div>

  <div class="last-number">
    <div class="last-number-label">Dernier numéro</div>
    <div id="lastNumber" class="last-number-value empty">—</div>
    <div class="stats"><span id="drawnCount">0</span> / 90 tirés</div>
  </div>

  <div id="loadingState" class="loading">Connexion à Firebase…</div>
  <div id="grid" class="grid" style="display:none;"></div>

  <div class="history">
    <h3>Historique (du plus récent au plus ancien)</h3>
    <div id="historyList" class="history-list">
      <span class="history-empty">Aucun numéro tiré pour l'instant</span>
    </div>
  </div>

  <div id="adminActions" style="display:none; text-align:center; margin-top: 20px;">
    <button id="resetBtn" class="btn-danger">🔄 Réinitialiser la partie</button>
  </div>
</div>

<div id="passwordModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h2>Accès admin</h2>
    <p style="margin-bottom: 14px; color: #666;">Entre le mot de passe admin.</p>
    <input type="password" id="passwordInput" placeholder="Mot de passe" autocomplete="off">
    <div id="passwordError" class="error-msg"></div>
    <div class="modal-actions">
      <button id="cancelPasswordBtn" class="btn-secondary" style="color:#333; background:#eee;">Annuler</button>
      <button id="submitPasswordBtn" class="btn-primary">Valider</button>
    </div>
  </div>
</div>

<div id="connStatus" class="connection-status offline">Hors ligne</div>

<script type="module">
  // ============================================================
  // ⚠️  CONFIGURATION FIREBASE — À REMPLACER PAR TES VALEURS ⚠️
  // ============================================================
  // Copie ici l'objet firebaseConfig affiché dans la console Firebase
  // (Paramètres du projet → Vos applications → bloc Configuration SDK)
  const firebaseConfig = {
  apiKey: "AIzaSyDoRNEUMmkRQz4Y349w_6N3mnjcqwcx1S0",
  authDomain: "bingo-d-esther.firebaseapp.com",
  databaseURL: "https://bingo-d-esther-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "bingo-d-esther",
  storageBucket: "bingo-d-esther.firebasestorage.app",
  messagingSenderId: "434410908040",
  appId: "1:434410908040:web:7aff3be56760b91d5e323d",
  measurementId: "G-6LZXDR5X16"
};

  // ============================================================
  // MOT DE PASSE ADMIN — change cette valeur
  // ============================================================
  const ADMIN_PASSWORD = "change-moi";

  // ============================================================
  // (Pas besoin de modifier en dessous)
  // ============================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const stateRef = ref(db, 'bingo/state');

  const TOTAL = 90;
  let state = { drawn: [], lastNumber: null };
  let isAdmin = false;

  const grid = document.getElementById('grid');
  const loadingState = document.getElementById('loadingState');
  const lastNumberEl = document.getElementById('lastNumber');
  const drawnCountEl = document.getElementById('drawnCount');
  const historyListEl = document.getElementById('historyList');
  const adminBanner = document.getElementById('adminBanner');
  const adminActions = document.getElementById('adminActions');
  const viewPublicBtn = document.getElementById('viewPublicBtn');
  const viewAdminBtn = document.getElementById('viewAdminBtn');
  const resetBtn = document.getElementById('resetBtn');
  const connStatus = document.getElementById('connStatus');

  const passwordModal = document.getElementById('passwordModal');
  const passwordInput = document.getElementById('passwordInput');
  const passwordError = document.getElementById('passwordError');
  const submitPasswordBtn = document.getElementById('submitPasswordBtn');
  const cancelPasswordBtn = document.getElementById('cancelPasswordBtn');

  function buildGrid() {
    grid.innerHTML = '';
    for (let i = 1; i <= TOTAL; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = i;
      cell.dataset.number = i;
      cell.addEventListener('click', () => {
        if (!isAdmin) return;
        toggleNumber(i);
      });
      grid.appendChild(cell);
    }
  }

  function render() {
    const drawnSet = new Set(state.drawn);
    document.querySelectorAll('.cell').forEach(cell => {
      const n = parseInt(cell.dataset.number);
      cell.classList.toggle('drawn', drawnSet.has(n));
      cell.classList.toggle('last', n === state.lastNumber);
      cell.classList.toggle('admin', isAdmin);
    });

    if (state.lastNumber) {
      lastNumberEl.textContent = state.lastNumber;
      lastNumberEl.classList.remove('empty');
    } else {
      lastNumberEl.textContent = '—';
      lastNumberEl.classList.add('empty');
    }

    drawnCountEl.textContent = state.drawn.length;

    if (state.drawn.length === 0) {
      historyListEl.innerHTML = '<span class="history-empty">Aucun numéro tiré pour l\'instant</span>';
    } else {
      const reversed = [...state.drawn].reverse();
      historyListEl.innerHTML = reversed
        .map((n, idx) => `<span class="history-item${idx === 0 ? ' latest' : ''}">${n}</span>`)
        .join('');
    }
  }

  // Écoute temps réel des changements
  onValue(stateRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
      state = {
        drawn: Array.isArray(data.drawn) ? data.drawn : [],
        lastNumber: data.lastNumber ?? null
      };
    } else {
      state = { drawn: [], lastNumber: null };
    }
    loadingState.style.display = 'none';
    grid.style.display = 'grid';
    connStatus.className = 'connection-status online';
    connStatus.textContent = 'En ligne';
    render();
  }, (error) => {
    console.error('Firebase error:', error);
    loadingState.textContent = '❌ Erreur de connexion. Vérifie ta config Firebase.';
    connStatus.className = 'connection-status offline';
    connStatus.textContent = 'Erreur';
  });

  async function saveState() {
    try {
      await set(stateRef, state);
    } catch (e) {
      console.error('Save failed', e);
      alert('Erreur de sauvegarde : ' + e.message);
    }
  }

  async function toggleNumber(n) {
    const idx = state.drawn.indexOf(n);
    if (idx >= 0) {
      state.drawn.splice(idx, 1);
      if (state.lastNumber === n) {
        state.lastNumber = state.drawn.length > 0 ? state.drawn[state.drawn.length - 1] : null;
      }
    } else {
      state.drawn.push(n);
      state.lastNumber = n;
    }
    render();
    await saveState();
  }

  async function resetGame() {
    if (!confirm('Réinitialiser la partie ? Tous les numéros tirés seront effacés.')) return;
    state = { drawn: [], lastNumber: null };
    render();
    await saveState();
  }

  function setMode(admin) {
    isAdmin = admin;
    adminBanner.style.display = admin ? 'block' : 'none';
    adminActions.style.display = admin ? 'block' : 'none';
    viewAdminBtn.classList.toggle('btn-active', admin);
    viewAdminBtn.classList.toggle('btn-secondary', !admin);
    viewPublicBtn.classList.toggle('btn-active', !admin);
    viewPublicBtn.classList.toggle('btn-secondary', admin);
    render();
  }

  function tryAdminLogin() {
    passwordModal.style.display = 'flex';
    passwordError.textContent = '';
    passwordInput.value = '';
    passwordInput.focus();
  }

  submitPasswordBtn.addEventListener('click', () => {
    if (passwordInput.value === ADMIN_PASSWORD) {
      passwordModal.style.display = 'none';
      setMode(true);
    } else {
      passwordError.textContent = 'Mot de passe incorrect';
    }
  });
  passwordInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitPasswordBtn.click();
  });
  cancelPasswordBtn.addEventListener('click', () => {
    passwordModal.style.display = 'none';
  });

  viewAdminBtn.addEventListener('click', () => {
    if (isAdmin) return;
    tryAdminLogin();
  });
  viewPublicBtn.addEventListener('click', () => {
    if (!isAdmin) return;
    setMode(false);
  });
  resetBtn.addEventListener('click', resetGame);

  buildGrid();
</script>
</body>
</html>
